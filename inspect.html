<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Property Inspection</title>
<style>
  :root {
    --bg:#000; --surface:#1c1c1e; --surface2:#2c2c2e; --surface3:#3a3a3c;
    --text:#fff; --text2:#ebebf599; --text3:#ebebf54d; --accent:#0a84ff; --accent2:#409cff;
    --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --border:#ffffff14; --radius:18px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,'SF Pro Text',BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased; padding:env(safe-area-inset-top) 0 0; }
  svg { display:block; }
  .wrap { max-width:620px; margin:0 auto; padding:20px 18px calc(120px + env(safe-area-inset-bottom)); animation:fade .4s var(--ease); }
  @keyframes fade { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  .header { text-align:center; padding:14px 0 6px; }
  .header .logo { width:72px; height:72px; border-radius:20px; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; color:#fff; background:linear-gradient(160deg,var(--accent2),var(--accent)); box-shadow:0 16px 36px -12px var(--accent); }
  .header h1 { font-size:26px; font-weight:800; letter-spacing:-0.5px; }
  .header .prop { font-size:17px; color:var(--accent); font-weight:600; margin-top:5px; }
  .header .due { font-size:14px; color:var(--text2); margin-top:6px; }
  .note { background:var(--surface); border-radius:14px; padding:14px 16px; margin:18px 0; font-size:15px; line-height:1.5; color:var(--text2); }
  .note b { color:var(--text); }
  .progress { font-size:14px; color:var(--text2); text-align:center; margin:6px 0 10px; font-weight:500; }

  .room { background:var(--surface); border-radius:var(--radius); margin-bottom:13px; overflow:hidden; box-shadow:0 1px 1px #0000001a, 0 10px 24px -20px #000000cc; }
  .room-head { display:flex; align-items:center; gap:12px; padding:14px 16px; }
  .room-head .ric { width:34px; height:34px; border-radius:9px; background:#0a84ff1f; color:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .room-head .name { flex:1; font-size:17px; font-weight:600; letter-spacing:-0.2px; }
  .room-head .count { font-size:13px; color:var(--text2); display:flex; align-items:center; gap:5px; }
  .room-head .count.done { color:var(--green); }
  .thumbs { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:0 16px 14px; }
  .thumb { position:relative; aspect-ratio:1; border-radius:11px; overflow:hidden; background:var(--surface2); animation:pop .25s var(--ease); }
  @keyframes pop { from { transform:scale(.8); opacity:0; } to { transform:scale(1); opacity:1; } }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumb .del { position:absolute; top:5px; right:5px; width:24px; height:24px; border-radius:50%; background:#000000c0; color:#fff; border:none; display:flex; align-items:center; justify-content:center; }
  .add-tile { aspect-ratio:1; border-radius:11px; background:var(--surface2); border:1.5px dashed var(--surface3); color:var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; transition:transform .12s var(--ease), border-color .15s; }
  .add-tile:active { transform:scale(.95); border-color:var(--accent); }
  .add-tile .lbl { font-size:11px; font-weight:600; }

  .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:16px; border-radius:14px; border:none; font-size:17px; font-weight:700; letter-spacing:-0.2px; background:linear-gradient(180deg,var(--accent2),var(--accent)); color:#fff; box-shadow:0 8px 22px -10px var(--accent); transition:transform .12s var(--ease), opacity .15s; }
  .btn:active { transform:scale(.98); }
  .btn:disabled { opacity:.45; box-shadow:none; }
  .submit-bar { position:fixed; left:0; right:0; bottom:0; padding:14px 18px calc(14px + env(safe-area-inset-bottom)); background:#0c0c0ccc; backdrop-filter:saturate(180%) blur(24px); -webkit-backdrop-filter:saturate(180%) blur(24px); border-top:0.5px solid var(--border); }
  .submit-bar .inner { max-width:620px; margin:0 auto; }

  .state { text-align:center; padding:90px 28px; animation:fade .4s var(--ease); max-width:480px; margin:0 auto; }
  .state .big { width:88px; height:88px; border-radius:26px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; }
  .state .big.ok { background:linear-gradient(160deg,#34d65c,#28c052); color:#fff; box-shadow:0 16px 40px -12px var(--green); }
  .state .big.err { background:var(--surface); color:var(--orange); }
  .state h2 { font-size:24px; font-weight:800; letter-spacing:-0.4px; }
  .state p { font-size:15px; color:var(--text2); margin-top:11px; line-height:1.55; }
  .spinner { width:34px; height:34px; border:3px solid var(--surface3); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .hidden { display:none !important; }
  .overlay { position:fixed; inset:0; background:#000000d9; backdrop-filter:blur(4px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:100; }
  .overlay p { color:var(--text2); font-size:15px; font-weight:500; }
  .dialog-overlay { position:fixed; inset:0; background:#00000099; z-index:300; display:none; align-items:center; justify-content:center; padding:36px; opacity:0; transition:opacity .18s; }
  .dialog-overlay.open { opacity:1; }
  .dialog { background:var(--surface2); border-radius:16px; width:100%; max-width:290px; overflow:hidden; text-align:center; animation:dialogIn .22s var(--ease); box-shadow:0 24px 60px -12px #000000cc; }
  @keyframes dialogIn { from { transform:scale(1.08); opacity:0; } to { transform:scale(1); opacity:1; } }
  .dialog-body { padding:20px 18px 17px; }
  .dialog-body h3 { font-size:17px; font-weight:700; letter-spacing:-0.3px; }
  .dialog-body p { font-size:13px; color:var(--text2); margin-top:6px; line-height:1.45; }
  .dialog-actions { display:flex; border-top:0.5px solid var(--border); }
  .dialog-actions button { flex:1; padding:13px; background:none; border:none; font-size:17px; color:var(--accent); font-weight:600; }
  .dialog-actions button:active { background:#ffffff0f; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms !important; transition-duration:.001ms !important; } }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f2f2f7; --surface:#ffffff; --surface2:#ececf1; --surface3:#d6d6de; --text:#000; --text2:#3c3c4399; --text3:#3c3c4366; --border:#0000001f; }
    .submit-bar { background:#fbfbfdcc; }
    .dialog { background:#fbfbfd; }
    .dialog-actions button:active { background:#00000008; }
  }
</style>
</head>
<body>

<div id="loading" class="state"><div class="spinner"></div><p style="margin-top:20px">Loading inspection…</p></div>

<div id="error" class="state hidden">
  <div class="big err" id="errIcon"></div>
  <h2 id="errTitle">Link not valid</h2>
  <p id="errMsg">This inspection link is invalid or has expired. Please ask your landlord for a new one.</p>
</div>

<div id="done" class="state hidden">
  <div class="big ok" id="doneIcon"></div>
  <h2>Photos submitted</h2>
  <p>Thank you. Your inspection photos have been sent to your landlord — you can close this page now.</p>
</div>

<div id="form" class="wrap hidden">
  <div class="header">
    <div class="logo" id="formLogo"></div>
    <h1>Property Inspection</h1>
    <div class="prop" id="propName"></div>
    <div class="due" id="dueDate"></div>
  </div>
  <div class="note" id="note"></div>
  <div class="progress" id="progress"></div>
  <div id="rooms"></div>
</div>

<div id="submitBar" class="submit-bar hidden">
  <div class="inner"><button class="btn" id="submitBtn" disabled>Submit photos</button></div>
</div>

<div id="uploading" class="overlay hidden"><div class="spinner"></div><p id="uploadMsg">Uploading photos…</p></div>

<div class="dialog-overlay" id="dialogOverlay" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle">
  <div class="dialog"><div class="dialog-body"><h3 id="dialogTitle"></h3><p id="dialogMsg"></p></div><div class="dialog-actions"><button id="dialogOk">OK</button></div></div>
</div>

<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const CFG = window.APP_CONFIG || {};
const sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const FN = CFG.SUPABASE_URL + '/functions/v1';
const token = new URLSearchParams(location.search).get('token');

const $ = s => document.querySelector(s);
const show = (id) => { ['loading','error','done','form'].forEach(x => $('#'+x).classList.toggle('hidden', x!==id)); };
const escapeHtml = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ICONS = {
  home:'<path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.5l1.7-2.5h7.6L17.5 6H21a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="3.5"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  tree:'<path d="M12 3 7 10h2.5L6 16h12l-3.5-6H17z"/><line x1="12" y1="16" x2="12" y2="21"/>',
  bed:'<path d="M3 20v-8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8"/><path d="M5 10V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4"/><line x1="3" y1="17" x2="21" y2="17"/>',
  bath:'<path d="M4 12V5a2 2 0 0 1 2-2c1 0 1.7.4 2.2 1L9 5"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><line x1="7" y1="19" x2="7" y2="21"/><line x1="17" y1="19" x2="17" y2="21"/>',
  utensils:'<path d="M3 2v7a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V2"/><line x1="7" y1="2" x2="7" y2="22"/><path d="M21 15V2a5 5 0 0 0-5 5v6a2 2 0 0 0 2 2h3z"/><line x1="21" y1="15" x2="21" y2="22"/>',
  sofa:'<path d="M20 10V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v3"/><path d="M2 12a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/><line x1="5" y1="20" x2="5" y2="22"/><line x1="19" y1="20" x2="19" y2="22"/>',
  cup:'<path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/>',
  laundry:'<rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="13" r="4.5"/><line x1="8" y1="6" x2="8.01" y2="6"/><line x1="12" y1="6" x2="12.01" y2="6"/>',
  car:'<path d="M5 17H3v-4l2-5h11l3 5h2v4h-2"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/><line x1="9.5" y1="17" x2="14.5" y2="17"/>',
  door:'<path d="M4 21V4a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v17"/><line x1="2" y1="21" x2="22" y2="21"/><circle cx="15.5" cy="12" r="1" fill="currentColor"/>',
  monitor:'<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
  sun:'<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.9" y1="4.9" x2="7" y2="7"/><line x1="17" y1="17" x2="19.1" y2="19.1"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.9" y1="19.1" x2="7" y2="17"/><line x1="17" y1="7" x2="19.1" y2="4.9"/>',
};
const svg = (name, size=24, sw=2) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;

$('#formLogo').innerHTML = `<svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M8 17.5 24 5l16 12.5" stroke-width="3.4" opacity=".45"/><path d="M8 25 24 12.5 40 25" stroke-width="3.4"/><path d="M12.5 24.5V40a1.5 1.5 0 0 0 1.5 1.5h20a1.5 1.5 0 0 0 1.5-1.5V24.5" stroke-width="3.4"/><path d="M20 41.5v-8a4 4 0 0 1 8 0v8" stroke-width="3.4"/></svg>`;
$('#doneIcon').innerHTML = svg('check', 44, 3);
$('#errIcon').innerHTML = svg('link', 40);

const DEFAULT_ROOMS = ['Front of property','Living room','Kitchen','Bathroom','Bedroom','Laundry','Rear of property'];
function iconFor(room) {
  const r = String(room).toLowerCase();
  if (r.includes('front')) return 'home';
  if (r.includes('rear') || r.includes('back')) return 'tree';
  if (r.includes('bedroom') || r.includes('bed ')) return 'bed';
  if (r.includes('bath') || r.includes('ensuite') || r.includes('toilet') || r.includes('wc') || r.includes('powder')) return 'bath';
  if (r.includes('kitchen') || r.includes('pantry')) return 'utensils';
  if (r.includes('living') || r.includes('lounge') || r.includes('family') || r.includes('rumpus') || r.includes('media')) return 'sofa';
  if (r.includes('dining') || r.includes('meals')) return 'cup';
  if (r.includes('laundry')) return 'laundry';
  if (r.includes('garage') || r.includes('carport') || r.includes('driveway')) return 'car';
  if (r.includes('hall') || r.includes('entry') || r.includes('stair')) return 'door';
  if (r.includes('study') || r.includes('office')) return 'monitor';
  if (r.includes('yard') || r.includes('garden') || r.includes('balcony') || r.includes('exterior') || r.includes('patio') || r.includes('courtyard') || r.includes('deck') || r.includes('pool') || r.includes('alfresco')) return 'sun';
  return 'camera';
}

const photos = {}; // { [room]: [ { id, file, url } ] }
let rooms = DEFAULT_ROOMS;

async function callFn(name, body) {
  const res = await fetch(`${FN}/${name}`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'apikey': CFG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + CFG.SUPABASE_ANON_KEY },
    body: JSON.stringify(body),
  });
  let data = {};
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
  return data;
}

async function init() {
  if (!CFG.SUPABASE_URL || CFG.SUPABASE_URL.startsWith('REPLACE')) return fail('Not configured', 'This page is not connected to a backend yet.');
  if (!token) return fail('Missing link', 'This inspection link is incomplete. Please ask your landlord to resend it.');
  try {
    const info = await callFn('get-inspection', { token });
    if (info.status === 'submitted') return fail('Already submitted', 'These inspection photos have already been submitted. Thank you!', true);
    $('#propName').textContent = info.property || 'Your property';
    $('#dueDate').textContent = info.due_date ? ('Please submit by ' + new Date(info.due_date).toLocaleDateString('en-AU', { day:'numeric', month:'long', year:'numeric' })) : '';
    $('#note').innerHTML = '<b>From your landlord:</b> ' + escapeHtml(info.notes || 'Please take clear photos of each room.');
    if (Array.isArray(info.rooms) && info.rooms.length) rooms = info.rooms;
    renderRooms();
    show('form');
    $('#submitBar').classList.remove('hidden');
  } catch (e) {
    fail('Link not valid', e.message || 'This inspection link is invalid or has expired.');
  }
}

function fail(title, msg, ok) {
  $('#errTitle').textContent = title; $('#errMsg').textContent = msg;
  const icon = $('#errIcon'); icon.className = 'big ' + (ok ? 'ok' : 'err'); icon.innerHTML = ok ? svg('check',44,3) : svg('link',40);
  show('error'); $('#submitBar').classList.add('hidden');
}

function renderRooms() {
  const c = $('#rooms'); c.innerHTML = '';
  rooms.forEach(room => {
    const list = photos[room] || [];
    const el = document.createElement('div'); el.className = 'room';
    el.innerHTML = `
      <div class="room-head">
        <span class="ric">${svg(iconFor(room), 18)}</span>
        <span class="name">${escapeHtml(room)}</span>
        <span class="count ${list.length?'done':''}" ${list.length?'':'style="color:var(--orange)"'}>${list.length?svg('check',15,2.5)+list.length:'Required'}</span>
      </div>
      <div class="thumbs"></div>`;
    const thumbs = el.querySelector('.thumbs');
    list.forEach(ph => {
      const t = document.createElement('div'); t.className = 'thumb';
      t.innerHTML = `<img src="${ph.url}"><button class="del" aria-label="Remove">${svg('x',14,2.5)}</button>`;
      t.querySelector('.del').onclick = () => { photos[room] = photos[room].filter(x=>x.id!==ph.id); renderRooms(); };
      thumbs.appendChild(t);
    });
    const add = document.createElement('label'); add.className = 'add-tile';
    add.innerHTML = svg('camera',24) + '<span class="lbl">Add</span>';
    const input = document.createElement('input'); input.type='file'; input.accept='image/*'; input.multiple=true; input.style.display='none';
    input.onchange = () => { addFiles(room, input.files); input.value=''; };
    add.appendChild(input); thumbs.appendChild(add);
    c.appendChild(el);
  });
  updateProgress();
}

function addFiles(room, fileList) {
  photos[room] = photos[room] || [];
  for (const file of fileList) {
    if (!file.type.startsWith('image/')) continue;
    photos[room].push({ id: Math.random().toString(36).slice(2), file, url: URL.createObjectURL(file) });
  }
  renderRooms();
}

function totalPhotos() { return Object.values(photos).reduce((s,a)=>s+a.length,0); }
function updateProgress() {
  const n = totalPhotos();
  const missing = rooms.filter(r => !(photos[r] && photos[r].length));
  const captured = rooms.length - missing.length;
  $('#progress').textContent = missing.length
    ? `${captured}/${rooms.length} rooms done — still need: ${missing.join(', ')}`
    : `All ${rooms.length} rooms captured — ${n} photo${n>1?'s':''} ready`;
  $('#submitBtn').disabled = missing.length > 0 || n === 0;
  $('#submitBtn').textContent = missing.length ? `${missing.length} room${missing.length>1?'s':''} still needed` : `Submit ${n} photo${n>1?'s':''}`;
}

$('#submitBtn').onclick = async () => {
  const all = [];
  for (const room of Object.keys(photos)) for (const ph of photos[room]) all.push({ room, ph });
  if (!all.length) return;
  $('#uploading').classList.remove('hidden');
  let done = 0;
  try {
    for (const { room, ph } of all) {
      $('#uploadMsg').textContent = `Uploading photo ${done+1} of ${all.length}…`;
      const ext = (ph.file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
      const { path, token: uploadToken } = await callFn('create-photo-upload-url', { token, room, ext });
      const { error: upErr } = await sb.storage.from('inspection-photos').uploadToSignedUrl(path, uploadToken, ph.file, { contentType: ph.file.type });
      if (upErr) throw new Error('Upload failed: ' + upErr.message);
      await callFn('record-photo', { token, storage_path: path, room });
      done++;
    }
    $('#uploadMsg').textContent = 'Finishing…';
    await callFn('complete-inspection', { token });
    show('done'); $('#submitBar').classList.add('hidden'); $('#uploading').classList.add('hidden');
  } catch (e) {
    $('#uploading').classList.add('hidden');
    showDialog('Something went wrong', (e.message || 'Please try again.') + (done ? ` ${done} photo(s) were uploaded before the error.` : ''));
  }
};

function showDialog(title, msg) {
  $('#dialogTitle').textContent = title; $('#dialogMsg').textContent = msg;
  const ov = $('#dialogOverlay'); ov.style.display = 'flex'; requestAnimationFrame(() => ov.classList.add('open'));
}
$('#dialogOk').onclick = () => { const ov=$('#dialogOverlay'); ov.classList.remove('open'); setTimeout(()=>{ ov.style.display='none'; },180); };

init();
</script>
</body>
</html>
