<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Property Manager">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Property Manager</title>
<style>
  :root {
    --bg: #000;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --surface3: #3a3a3c;
    --text: #fff;
    --text2: #ebebf599;
    --text3: #ebebf54d;
    --accent: #0a84ff;
    --green: #30d158;
    --red: #ff453a;
    --orange: #ff9f0a;
    --purple: #bf5af2;
    --teal: #40c8e0;
    --radius: 16px;
    --radius-sm: 10px;
    --border: #ffffff14;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh; min-height: -webkit-fill-available;
    overflow-x: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top);
  }
  html { height: -webkit-fill-available; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }

  /* ─── SCREENS ─── */
  .screen { display: none; min-height: 100vh; flex-direction: column; }
  .screen.active { display: flex; }

  /* ─── NAV BAR ─── */
  .nav-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px 4px; position: sticky; top: 0; z-index: 10; background: var(--bg);
    gap: 12px;
  }
  .nav-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .nav-title { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-back { background: none; border: none; color: var(--accent); font-size: 17px; display: flex; align-items: center; gap: 2px; padding: 4px 0; }
  .nav-icon-btn {
    width: 36px; height: 36px; border-radius: 50%; background: var(--surface2); border: none;
    display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 22px; flex-shrink: 0;
  }

  /* ─── SCROLL CONTENT ─── */
  .scroll-content { flex: 1; overflow-y: auto; padding: 8px 0 110px; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
  .scroll-content::-webkit-scrollbar { display: none; }

  /* ─── SECTIONS / CARDS ─── */
  .section-header { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 20px 8px; }
  .section-title { font-size: 15px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.4px; }
  .section-action { font-size: 15px; color: var(--accent); background: none; border: none; }
  .group { margin: 0 16px 8px; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 0.5px solid var(--border); position: relative; }
  .row:last-child { border-bottom: none; }
  .row.tappable:active { background: var(--surface2); }
  .row-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .row-body { flex: 1; min-width: 0; }
  .row-title { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-sub { font-size: 13px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-trail { font-size: 16px; color: var(--text2); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .row-trail .chev { color: var(--text3); font-size: 18px; }
  .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
  .amount.pos { color: var(--green); }
  .amount.neg { color: var(--red); }

  /* ─── BADGES ─── */
  .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .badge.green { background: #30d15822; color: var(--green); }
  .badge.red { background: #ff453a22; color: var(--red); }
  .badge.orange { background: #ff9f0a22; color: var(--orange); }
  .badge.gray { background: var(--surface3); color: var(--text2); }
  .badge.blue { background: #0a84ff22; color: var(--accent); }

  /* ─── DASHBOARD STAT CARDS ─── */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 8px 16px; }
  .stat-card { background: var(--surface); border-radius: var(--radius); padding: 16px; }
  .stat-label { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .stat-value { font-size: 26px; font-weight: 700; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .stat-foot { font-size: 12px; color: var(--text3); margin-top: 4px; }

  /* ─── EMPTY STATE ─── */
  .empty { text-align: center; padding: 48px 32px; color: var(--text2); }
  .empty .emoji { font-size: 44px; display: block; margin-bottom: 12px; }
  .empty .title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .empty .sub { font-size: 14px; line-height: 1.4; }

  /* ─── BUTTONS ─── */
  .btn { display: block; width: 100%; padding: 15px; border-radius: 14px; border: none; font-size: 17px; font-weight: 600; background: var(--accent); color: #fff; }
  .btn:active { opacity: .85; }
  .btn.secondary { background: var(--surface2); color: var(--accent); }
  .btn.danger { background: #ff453a1f; color: var(--red); }
  .btn.green { background: var(--green); color: #fff; }
  .btn:disabled { opacity: .45; }

  /* ─── SEGMENTED CONTROL ─── */
  .segmented { display: flex; background: var(--surface2); border-radius: 10px; padding: 2px; margin: 8px 16px; }
  .segmented button { flex: 1; border: none; background: none; color: var(--text2); font-size: 14px; font-weight: 600; padding: 8px; border-radius: 8px; }
  .segmented button.active { background: var(--surface3); color: var(--text); }

  /* ─── TAB BAR ─── */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex; z-index: 50;
    background: #0a0a0aee; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid var(--border); padding-bottom: env(safe-area-inset-bottom);
  }
  .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 7px; background: none; border: none; color: var(--text3); }
  .tab-item.active { color: var(--accent); }
  .tab-item .ico { font-size: 22px; line-height: 1; }
  .tab-item .lbl { font-size: 10px; font-weight: 500; }

  /* ─── MODAL / SHEET ─── */
  .sheet-overlay { position: fixed; inset: 0; background: #000000aa; z-index: 100; display: none; align-items: flex-end; }
  .sheet-overlay.open { display: flex; }
  .sheet {
    background: #1c1c1e; width: 100%; max-height: 92vh; border-radius: 20px 20px 0 0; overflow-y: auto;
    padding: 8px 20px calc(28px + env(safe-area-inset-bottom)); animation: slideUp .28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-grip { width: 38px; height: 5px; background: var(--surface3); border-radius: 3px; margin: 8px auto 12px; }
  .sheet-title { font-size: 22px; font-weight: 700; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--surface2); border: 0.5px solid var(--border); color: var(--text);
    font-size: 16px; padding: 13px 14px; border-radius: 12px; outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { min-height: 80px; resize: vertical; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }
  .sheet-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }

  /* ─── AUTH ─── */
  .auth-wrap { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 32px 28px calc(32px + env(safe-area-inset-bottom)); }
  .auth-logo { font-size: 56px; text-align: center; margin-bottom: 12px; }
  .auth-title { font-size: 30px; font-weight: 800; text-align: center; letter-spacing: -0.5px; }
  .auth-sub { font-size: 15px; color: var(--text2); text-align: center; margin: 8px 0 28px; line-height: 1.4; }
  .auth-toggle { text-align: center; margin-top: 18px; color: var(--text2); font-size: 14px; }
  .auth-toggle button { background: none; border: none; color: var(--accent); font-size: 14px; font-weight: 600; }
  .auth-msg { text-align: center; font-size: 14px; margin-top: 16px; min-height: 20px; }
  .auth-msg.err { color: var(--red); }
  .auth-msg.ok { color: var(--green); }

  /* ─── PHOTO GRID ─── */
  .photo-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; padding: 4px 16px; }
  .photo-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--surface2); }
  .room-label { font-size: 14px; font-weight: 600; color: var(--text2); padding: 14px 20px 2px; }

  /* ─── MISC ─── */
  .spinner { width: 22px; height: 22px; border: 2.5px solid var(--surface3); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center-load { display: flex; justify-content: center; padding: 48px; }
  .toast { position: fixed; bottom: calc(80px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: var(--surface3); color: #fff; padding: 12px 20px; border-radius: 30px; font-size: 14px; font-weight: 500; z-index: 200; opacity: 0; transition: opacity .2s; pointer-events: none; box-shadow: 0 8px 30px #00000080; }
  .toast.show { opacity: 1; }
  .copy-link { display: flex; gap: 8px; align-items: center; background: var(--surface2); border-radius: 12px; padding: 12px 14px; margin-top: 4px; }
  .copy-link .url { flex: 1; font-size: 13px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .copy-link button { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 9px; font-size: 14px; font-weight: 600; }
  .config-warn { margin: 16px; padding: 14px 16px; background: #ff9f0a1f; border: 0.5px solid #ff9f0a55; border-radius: 12px; color: var(--orange); font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>

<!-- ══════════ AUTH ══════════ -->
<div id="auth" class="screen active">
  <div class="auth-wrap">
    <div class="auth-logo">🏠</div>
    <div class="auth-title">Property Manager</div>
    <div class="auth-sub">Track tenants, money & inspections — all in one place.</div>
    <div id="configWarn"></div>
    <div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button id="authSubmit" class="btn">Sign in</button>
    <div id="authMsg" class="auth-msg"></div>
    <div class="auth-toggle"><span id="authToggleText">No account yet?</span> <button id="authToggle">Create one</button></div>
  </div>
</div>

<!-- ══════════ MAIN APP ══════════ -->
<div id="app" class="screen">

  <!-- DASHBOARD -->
  <div id="screen-dashboard" class="screen active">
    <div class="nav-bar"><div class="nav-left"><span class="nav-title">Overview</span></div><button class="nav-icon-btn" id="signOutBtn" title="Sign out">⏻</button></div>
    <div class="scroll-content" id="dashboardContent"></div>
  </div>

  <!-- PROPERTIES -->
  <div id="screen-properties" class="screen">
    <div class="nav-bar"><div class="nav-left"><span class="nav-title">Properties</span></div><button class="nav-icon-btn" data-add="property">＋</button></div>
    <div class="scroll-content" id="propertiesContent"></div>
  </div>

  <!-- PROPERTY DETAIL -->
  <div id="screen-property" class="screen">
    <div class="nav-bar"><div class="nav-left"><button class="nav-back" data-tab="properties">‹ Properties</button></div><button class="nav-icon-btn" id="editPropertyBtn">⋯</button></div>
    <div class="scroll-content" id="propertyContent"></div>
  </div>

  <!-- TENANTS -->
  <div id="screen-tenants" class="screen">
    <div class="nav-bar"><div class="nav-left"><span class="nav-title">Tenants</span></div><button class="nav-icon-btn" data-add="tenant">＋</button></div>
    <div class="scroll-content" id="tenantsContent"></div>
  </div>

  <!-- MONEY -->
  <div id="screen-money" class="screen">
    <div class="nav-bar"><div class="nav-left"><span class="nav-title">Money</span></div><button class="nav-icon-btn" id="moneyAddBtn">＋</button></div>
    <div class="segmented" id="moneySeg">
      <button data-money="payments" class="active">Rent</button>
      <button data-money="expenses">Expenses</button>
      <button data-money="bills">Bills</button>
    </div>
    <div class="scroll-content" id="moneyContent"></div>
  </div>

  <!-- INSPECTIONS -->
  <div id="screen-inspections" class="screen">
    <div class="nav-bar"><div class="nav-left"><span class="nav-title">Inspections</span></div><button class="nav-icon-btn" data-add="inspection">＋</button></div>
    <div class="scroll-content" id="inspectionsContent"></div>
  </div>

  <!-- INSPECTION DETAIL -->
  <div id="screen-inspection" class="screen">
    <div class="nav-bar"><div class="nav-left"><button class="nav-back" data-tab="inspections">‹ Inspections</button></div><button class="nav-icon-btn" id="inspectionMenuBtn">⋯</button></div>
    <div class="scroll-content" id="inspectionContent"></div>
  </div>

  <!-- TAB BAR -->
  <nav class="tab-bar">
    <button class="tab-item active" data-tab="dashboard"><span class="ico">⌂</span><span class="lbl">Overview</span></button>
    <button class="tab-item" data-tab="properties"><span class="ico">🏠</span><span class="lbl">Properties</span></button>
    <button class="tab-item" data-tab="tenants"><span class="ico">👤</span><span class="lbl">Tenants</span></button>
    <button class="tab-item" data-tab="money"><span class="ico">£</span><span class="lbl">Money</span></button>
    <button class="tab-item" data-tab="inspections"><span class="ico">📷</span><span class="lbl">Inspect</span></button>
  </nav>
</div>

<!-- SHEET / MODAL -->
<div class="sheet-overlay" id="sheetOverlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const CFG = window.APP_CONFIG || {};
const configured = CFG.SUPABASE_URL && !CFG.SUPABASE_URL.startsWith('REPLACE');
let sb = null;
if (configured) sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);

// ─── State ───
const state = { properties: [], tenants: [], expenses: [], bills: [], payments: [], inspections: [], currentTab: 'dashboard', currentProperty: null, currentInspection: null, moneyTab: 'payments' };

// ─── Helpers ───
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '£' + (Number(n)||0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : '—';
const fmtDay = n => { const s=['th','st','nd','rd']; const v=n%100; return n + (s[(v-20)%10]||s[v]||s[0]); };
const todayISO = () => new Date().toISOString().slice(0,10);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);}));
const propName = id => (state.properties.find(p=>p.id===id)||{}).name || 'Unknown property';
const tenantName = id => (state.tenants.find(t=>t.id===id)||{}).name || '—';

let toastTimer;
function toast(msg) { const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1900); }

const CATEGORY_ICONS = { Maintenance:'🔧', Repairs:'🛠️', Insurance:'🛡️', Tax:'🏛️', Management:'📋', Cleaning:'🧹', Utilities:'💡', Mortgage:'🏦', Other:'📦' };
const BILL_ICONS = { Electricity:'⚡', Gas:'🔥', Water:'💧', Internet:'🌐', Council:'🏛️', Insurance:'🛡️', Service:'🧰', Other:'📄' };

// ════════ AUTH ════════
let authMode = 'signin';
if (!configured) {
  $('#configWarn').innerHTML = '<div class="config-warn">⚠️ Backend not configured yet. Add your Supabase URL and key to <b>config.js</b> to enable sign-in and saving.</div>';
}
$('#authToggle').onclick = () => {
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  $('#authSubmit').textContent = authMode === 'signin' ? 'Sign in' : 'Create account';
  $('#authToggleText').textContent = authMode === 'signin' ? 'No account yet?' : 'Already have an account?';
  $('#authToggle').textContent = authMode === 'signin' ? 'Create one' : 'Sign in';
  $('#authMsg').textContent = '';
};
$('#authSubmit').onclick = async () => {
  if (!sb) { authMsg('Backend not configured.', 'err'); return; }
  const email = $('#authEmail').value.trim(), password = $('#authPassword').value;
  if (!email || !password) { authMsg('Enter your email and password.', 'err'); return; }
  $('#authSubmit').disabled = true;
  try {
    if (authMode === 'signup') {
      const { error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      authMsg('Account created! Check your email if confirmation is required, then sign in.', 'ok');
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (e) { authMsg(e.message || 'Something went wrong.', 'err'); }
  finally { $('#authSubmit').disabled = false; }
};
function authMsg(m, cls) { const el = $('#authMsg'); el.textContent = m; el.className = 'auth-msg ' + (cls||''); }
$('#signOutBtn').onclick = async () => { if (sb) await sb.auth.signOut(); };

async function onAuthed() {
  $('#auth').classList.remove('active');
  $('#app').classList.add('active');
  await loadAll();
}
function onSignedOut() {
  $('#app').classList.remove('active');
  $('#auth').classList.add('active');
  $('#authPassword').value = '';
}
if (sb) {
  sb.auth.onAuthStateChange((_e, session) => { if (session) onAuthed(); else onSignedOut(); });
  sb.auth.getSession().then(({ data }) => { if (data.session) onAuthed(); });
}

// ════════ DATA ════════
async function loadAll() {
  if (!sb) return;
  const tables = ['properties','tenants','expenses','bills','payments','inspections'];
  const results = await Promise.all(tables.map(t => sb.from(t).select('*')));
  tables.forEach((t,i) => { state[t] = results[i].data || []; });
  renderCurrent();
}
async function insert(table, row) {
  const { data: { user } } = await sb.auth.getUser();
  const { data, error } = await sb.from(table).insert({ ...row, owner_id: user.id }).select().single();
  if (error) { toast(error.message); throw error; }
  state[table].push(data); return data;
}
async function update(table, id, patch) {
  const { data, error } = await sb.from(table).update(patch).eq('id', id).select().single();
  if (error) { toast(error.message); throw error; }
  const arr = state[table]; const i = arr.findIndex(r=>r.id===id); if (i>=0) arr[i]=data; return data;
}
async function remove(table, id) {
  const { error } = await sb.from(table).delete().eq('id', id);
  if (error) { toast(error.message); throw error; }
  state[table] = state[table].filter(r=>r.id!==id);
}

// ════════ NAVIGATION ════════
function showScreen(id) {
  $$('#app > .screen').forEach(s => s.classList.toggle('active', s.id === id));
}
function setTab(tab) {
  state.currentTab = tab;
  $$('.tab-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  showScreen('screen-' + tab);
  renderCurrent();
}
$$('.tab-item, .nav-back').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

function renderCurrent() {
  const t = state.currentTab;
  if (t === 'dashboard') renderDashboard();
  else if (t === 'properties') renderProperties();
  else if (t === 'tenants') renderTenants();
  else if (t === 'money') renderMoney();
  else if (t === 'inspections') renderInspections();
}

// ════════ DASHBOARD ════════
function renderDashboard() {
  const now = new Date(), m = now.getMonth(), y = now.getFullYear();
  const inMonth = d => { const x = new Date(d); return x.getMonth()===m && x.getFullYear()===y; };
  const rentDue = state.payments.filter(p => p.status !== 'paid');
  const overdue = rentDue.filter(p => p.due_date && p.due_date < todayISO());
  const collected = state.payments.filter(p => p.status==='paid' && inMonth(p.paid_on||p.due_date)).reduce((s,p)=>s+Number(p.amount||0),0);
  const expMonth = state.expenses.filter(e=>inMonth(e.spent_on)).reduce((s,e)=>s+Number(e.amount||0),0);
  const pendingInspections = state.inspections.filter(i => i.status === 'pending');
  const recentExpenses = [...state.expenses].sort((a,b)=>(b.spent_on||'').localeCompare(a.spent_on||'')).slice(0,4);

  let html = `<div class="stat-grid">
    <div class="stat-card"><div class="stat-label">🏠 Properties</div><div class="stat-value">${state.properties.length}</div><div class="stat-foot">${state.tenants.length} tenant${state.tenants.length!==1?'s':''}</div></div>
    <div class="stat-card"><div class="stat-label">📷 Pending inspections</div><div class="stat-value">${pendingInspections.length}</div><div class="stat-foot">${state.inspections.filter(i=>i.status==='submitted').length} submitted</div></div>
    <div class="stat-card"><div class="stat-label">✅ Rent this month</div><div class="stat-value" style="color:var(--green)">${money(collected)}</div><div class="stat-foot">collected</div></div>
    <div class="stat-card"><div class="stat-label">💸 Expenses this month</div><div class="stat-value" style="color:var(--red)">${money(expMonth)}</div><div class="stat-foot">${state.expenses.filter(e=>inMonth(e.spent_on)).length} item${state.expenses.filter(e=>inMonth(e.spent_on)).length!==1?'s':''}</div></div>
  </div>`;

  if (overdue.length) {
    html += `<div class="section-header"><span class="section-title">⚠️ Overdue rent</span></div><div class="group">`;
    overdue.forEach(p => { html += rowHTML({ icon:'⏰', bg:'#ff453a22', title: tenantName(p.tenant_id), sub: 'Due ' + fmtDate(p.due_date), trail: `<span class="amount neg">${money(p.amount)}</span>` }); });
    html += `</div>`;
  }

  if (pendingInspections.length) {
    html += `<div class="section-header"><span class="section-title">Awaiting tenant photos</span><button class="section-action" data-tab="inspections">See all</button></div><div class="group">`;
    pendingInspections.slice(0,3).forEach(i => { html += rowHTML({ icon:'📷', bg:'#0a84ff22', title: propName(i.property_id), sub: 'Requested ' + fmtDate(i.requested_at), trail:'<span class="badge orange">Pending</span><span class="chev">›</span>', data:`data-inspection="${i.id}"`, tappable:true }); });
    html += `</div>`;
  }

  html += `<div class="section-header"><span class="section-title">Recent expenses</span><button class="section-action" data-tab="money">See all</button></div>`;
  if (recentExpenses.length) {
    html += `<div class="group">`;
    recentExpenses.forEach(e => { html += rowHTML({ icon: CATEGORY_ICONS[e.category]||'📦', bg:'var(--surface2)', title: e.description||e.category, sub: propName(e.property_id)+' · '+fmtDate(e.spent_on), trail:`<span class="amount neg">-${money(e.amount)}</span>` }); });
    html += `</div>`;
  } else {
    html += emptyHTML('🧾','Nothing logged yet','Add properties and start tracking your money.');
  }
  $('#dashboardContent').innerHTML = html;
  wireDelegates($('#dashboardContent'));
}

// ════════ PROPERTIES ════════
function renderProperties() {
  const el = $('#propertiesContent');
  if (!state.properties.length) { el.innerHTML = emptyHTML('🏠','No properties yet','Tap ＋ to add your first rental property.'); return; }
  let html = '<div class="group">';
  state.properties.forEach(p => {
    const tCount = state.tenants.filter(t=>t.property_id===p.id).length;
    html += rowHTML({ icon:'🏠', bg:'#0a84ff22', title: p.name, sub: p.address || `${tCount} tenant${tCount!==1?'s':''}`, trail:'<span class="chev">›</span>', data:`data-property="${p.id}"`, tappable:true });
  });
  html += '</div>';
  el.innerHTML = html;
  wireDelegates(el);
}

function renderProperty() {
  const p = state.properties.find(x=>x.id===state.currentProperty);
  if (!p) { setTab('properties'); return; }
  showScreen('screen-property');
  const tenants = state.tenants.filter(t=>t.property_id===p.id);
  const expenses = state.expenses.filter(e=>e.property_id===p.id);
  const bills = state.bills.filter(b=>b.property_id===p.id);
  const inspections = state.inspections.filter(i=>i.property_id===p.id);
  const totalExp = expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const rent = tenants.reduce((s,t)=>s+Number(t.rent_amount||0),0);

  let html = `<div class="nav-bar" style="padding-top:0"><div class="nav-left"><span class="nav-title">${esc(p.name)}</span></div></div>`;
  if (p.address) html += `<div style="padding:0 20px 4px;color:var(--text2);font-size:15px">📍 ${esc(p.address)}</div>`;
  html += `<div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Monthly rent</div><div class="stat-value" style="font-size:22px">${money(rent)}</div></div>
    <div class="stat-card"><div class="stat-label">Total expenses</div><div class="stat-value" style="font-size:22px;color:var(--red)">${money(totalExp)}</div></div>
  </div>`;
  if (p.notes) html += `<div class="section-header"><span class="section-title">Notes</span></div><div class="group"><div class="row"><div class="row-body"><div class="row-sub" style="white-space:normal">${esc(p.notes)}</div></div></div></div>`;

  html += `<div class="section-header"><span class="section-title">Tenants</span><button class="section-action" data-add="tenant" data-prop="${p.id}">Add</button></div>`;
  if (tenants.length) { html += '<div class="group">'; tenants.forEach(t => html += rowHTML({ icon:'👤', bg:'#bf5af222', title:t.name, sub: t.rent_amount?money(t.rent_amount)+'/mo':(t.email||''), trail:'<span class="chev">›</span>', data:`data-tenant="${t.id}"`, tappable:true })); html += '</div>'; }
  else html += `<div class="group"><div class="row"><div class="row-sub">No tenants assigned.</div></div></div>`;

  html += `<div class="section-header"><span class="section-title">Inspections</span><button class="section-action" data-add="inspection" data-prop="${p.id}">Request</button></div>`;
  if (inspections.length) { html += '<div class="group">'; inspections.slice(0,4).forEach(i => html += inspectionRow(i)); html += '</div>'; }
  else html += `<div class="group"><div class="row"><div class="row-sub">No inspections requested.</div></div></div>`;

  html += `<div class="section-header"><span class="section-title">Recent expenses</span></div>`;
  if (expenses.length) { html += '<div class="group">'; [...expenses].sort((a,b)=>(b.spent_on||'').localeCompare(a.spent_on||'')).slice(0,5).forEach(e => html += rowHTML({ icon:CATEGORY_ICONS[e.category]||'📦', bg:'var(--surface2)', title:e.description||e.category, sub:fmtDate(e.spent_on), trail:`<span class="amount neg">-${money(e.amount)}</span>` })); html += '</div>'; }
  else html += `<div class="group"><div class="row"><div class="row-sub">No expenses logged.</div></div></div>`;

  if (bills.length) {
    html += `<div class="section-header"><span class="section-title">Recurring bills</span></div><div class="group">`;
    bills.forEach(b => html += rowHTML({ icon:BILL_ICONS[b.name]||'📄', bg:'var(--surface2)', title:b.name, sub:`${b.frequency} · due ${fmtDay(b.due_day||1)}`, trail:`<span class="amount">${money(b.amount)}</span>` }));
    html += '</div>';
  }
  $('#propertyContent').innerHTML = html;
  wireDelegates($('#propertyContent'));
  $('#editPropertyBtn').onclick = () => propertyForm(p);
}

// ════════ TENANTS ════════
function renderTenants() {
  const el = $('#tenantsContent');
  if (!state.tenants.length) { el.innerHTML = emptyHTML('👤','No tenants yet','Add a property first, then assign tenants.'); return; }
  let html = '<div class="group">';
  state.tenants.forEach(t => html += rowHTML({ icon:'👤', bg:'#bf5af222', title:t.name, sub: propName(t.property_id), trail:'<span class="chev">›</span>', data:`data-tenant="${t.id}"`, tappable:true }));
  html += '</div>';
  el.innerHTML = html;
  wireDelegates(el);
}

// ════════ MONEY ════════
$$('#moneySeg button').forEach(b => b.onclick = () => {
  state.moneyTab = b.dataset.money;
  $$('#moneySeg button').forEach(x=>x.classList.toggle('active', x===b));
  renderMoney();
});
$('#moneyAddBtn').onclick = () => {
  if (state.moneyTab==='payments') paymentForm();
  else if (state.moneyTab==='expenses') expenseForm();
  else billForm();
};
function renderMoney() {
  const el = $('#moneyContent'); const tab = state.moneyTab;
  if (!state.properties.length) { el.innerHTML = emptyHTML('🏠','Add a property first','Money is tracked per property.'); return; }
  let html = '';
  if (tab === 'payments') {
    const sorted = [...state.payments].sort((a,b)=>(b.due_date||'').localeCompare(a.due_date||''));
    if (!sorted.length) html = emptyHTML('💷','No rent logged','Tap ＋ to record a rent payment.');
    else { html = '<div class="group">'; sorted.forEach(p => {
      const overdue = p.status!=='paid' && p.due_date && p.due_date < todayISO();
      const badge = p.status==='paid' ? '<span class="badge green">Paid</span>' : overdue ? '<span class="badge red">Overdue</span>' : '<span class="badge orange">Due</span>';
      html += rowHTML({ icon:'💷', bg:'#30d15822', title:tenantName(p.tenant_id), sub:`${propName(p.property_id)} · ${p.status==='paid'?'paid '+fmtDate(p.paid_on):'due '+fmtDate(p.due_date)}`, trail:`<span class="amount">${money(p.amount)}</span>${badge}<span class="chev">›</span>`, data:`data-payment="${p.id}"`, tappable:true });
    }); html += '</div>'; }
  } else if (tab === 'expenses') {
    const sorted = [...state.expenses].sort((a,b)=>(b.spent_on||'').localeCompare(a.spent_on||''));
    if (!sorted.length) html = emptyHTML('🧾','No expenses','Tap ＋ to log an expense.');
    else { const total = sorted.reduce((s,e)=>s+Number(e.amount||0),0);
      html = `<div class="section-header"><span class="section-title">${sorted.length} expenses</span><span class="amount neg">-${money(total)}</span></div><div class="group">`;
      sorted.forEach(e => html += rowHTML({ icon:CATEGORY_ICONS[e.category]||'📦', bg:'var(--surface2)', title:e.description||e.category, sub:`${propName(e.property_id)} · ${fmtDate(e.spent_on)}`, trail:`<span class="amount neg">-${money(e.amount)}</span><span class="chev">›</span>`, data:`data-expense="${e.id}"`, tappable:true }));
      html += '</div>'; }
  } else {
    if (!state.bills.length) html = emptyHTML('📄','No bills','Tap ＋ to add a recurring bill.');
    else { html = '<div class="group">'; state.bills.forEach(b => html += rowHTML({ icon:BILL_ICONS[b.name]||'📄', bg:'var(--surface2)', title:`${b.name}${b.provider?' · '+esc(b.provider):''}`, sub:`${propName(b.property_id)} · ${b.frequency}, due ${fmtDay(b.due_day||1)}`, trail:`<span class="amount">${money(b.amount)}</span><span class="chev">›</span>`, data:`data-bill="${b.id}"`, tappable:true })); html += '</div>'; }
  }
  el.innerHTML = html;
  wireDelegates(el);
}

// ════════ INSPECTIONS ════════
function inspectionRow(i) {
  const badge = i.status==='submitted' ? '<span class="badge green">Submitted</span>' : '<span class="badge orange">Pending</span>';
  return rowHTML({ icon:'📷', bg:'#0a84ff22', title:propName(i.property_id), sub: i.status==='submitted' ? 'Submitted '+fmtDate(i.submitted_at) : 'Requested '+fmtDate(i.requested_at), trail:`${badge}<span class="chev">›</span>`, data:`data-inspection="${i.id}"`, tappable:true });
}
function renderInspections() {
  const el = $('#inspectionsContent');
  if (!state.inspections.length) { el.innerHTML = emptyHTML('📷','No inspections yet','Request a bi-monthly inspection and your tenant submits photos via a private link.'); return; }
  const sorted = [...state.inspections].sort((a,b)=>(b.requested_at||'').localeCompare(a.requested_at||''));
  let html = '<div class="group">'; sorted.forEach(i => html += inspectionRow(i)); html += '</div>';
  el.innerHTML = html;
  wireDelegates(el);
}

async function renderInspection() {
  const i = state.inspections.find(x=>x.id===state.currentInspection);
  if (!i) { setTab('inspections'); return; }
  showScreen('screen-inspection');
  const el = $('#inspectionContent');
  const link = inspectLink(i.token);
  let html = `<div class="nav-bar" style="padding-top:0"><div class="nav-left"><span class="nav-title">Inspection</span></div></div>
    <div class="group">
      ${rowHTML({ icon:'🏠', bg:'#0a84ff22', title:propName(i.property_id), sub: i.tenant_id?tenantName(i.tenant_id):'No tenant assigned' })}
      ${rowHTML({ icon:'📅', bg:'var(--surface2)', title:'Requested', trail:fmtDate(i.requested_at) })}
      ${i.due_date?rowHTML({ icon:'⏳', bg:'var(--surface2)', title:'Due by', trail:fmtDate(i.due_date) }):''}
      ${rowHTML({ icon: i.status==='submitted'?'✅':'⏰', bg:'var(--surface2)', title:'Status', trail: i.status==='submitted'?'<span class="badge green">Submitted</span>':'<span class="badge orange">Awaiting photos</span>' })}
    </div>`;

  if (i.notes) html += `<div class="section-header"><span class="section-title">Note to tenant</span></div><div class="group"><div class="row"><div class="row-body"><div class="row-sub" style="white-space:normal">${esc(i.notes)}</div></div></div></div>`;

  if (i.status !== 'submitted') {
    html += `<div class="section-header"><span class="section-title">Share with tenant</span></div>
      <div style="padding:0 16px">
        <div style="color:var(--text2);font-size:14px;line-height:1.5;margin-bottom:8px">Send this private link to your tenant. They can take photos and submit — no account needed.</div>
        <div class="copy-link"><span class="url">${esc(link)}</span><button id="copyLinkBtn">Copy</button></div>
        <button class="btn secondary" id="shareLinkBtn" style="margin-top:10px">Share link…</button>
      </div>`;
  }

  html += `<div class="section-header"><span class="section-title">Photos</span></div><div id="photoArea"><div class="center-load"><div class="spinner"></div></div></div>`;
  el.innerHTML = html;

  if (i.status !== 'submitted') {
    $('#copyLinkBtn').onclick = async () => { try { await navigator.clipboard.writeText(link); toast('Link copied'); } catch(e){ toast('Copy failed'); } };
    const shareBtn = $('#shareLinkBtn');
    if (navigator.share) shareBtn.onclick = async () => { try { await navigator.share({ title:'Property inspection', text:'Please submit your inspection photos:', url:link }); } catch(e){} };
    else shareBtn.style.display = 'none';
  }
  $('#inspectionMenuBtn').onclick = () => inspectionMenu(i);

  // Load photos
  const { data: photos } = await sb.from('inspection_photos').select('*').eq('inspection_id', i.id).order('created_at');
  const area = $('#photoArea');
  if (!area) return;
  if (!photos || !photos.length) { area.innerHTML = `<div class="empty" style="padding:32px"><span class="sub">No photos submitted yet.</span></div>`; return; }
  const byRoom = {};
  for (const ph of photos) { (byRoom[ph.room||'Other'] ||= []).push(ph); }
  const paths = photos.map(p=>p.storage_path);
  const { data: signedList } = await sb.storage.from('inspection-photos').createSignedUrls(paths, 3600);
  const urlByPath = {}; (signedList||[]).forEach(s => { urlByPath[s.path] = s.signedUrl; });
  let phtml = '';
  for (const room of Object.keys(byRoom)) {
    phtml += `<div class="room-label">${esc(room)} · ${byRoom[room].length}</div><div class="photo-grid">`;
    for (const ph of byRoom[room]) {
      phtml += `<a href="${urlByPath[ph.storage_path]||'#'}" target="_blank" rel="noopener"><img loading="lazy" src="${urlByPath[ph.storage_path]||''}" alt="${esc(ph.caption||room)}"></a>`;
    }
    phtml += `</div>`;
  }
  area.innerHTML = phtml;
}

function inspectionMenu(i) {
  openSheet(`<div class="sheet-title">Inspection options</div>
    <div class="sheet-actions">
      ${i.status!=='submitted'?`<button class="btn secondary" id="mCopy">Copy tenant link</button>`:''}
      ${i.status!=='submitted'?`<button class="btn green" id="mDone">Mark as submitted</button>`:''}
      <button class="btn danger" id="mDel">Delete inspection</button>
    </div>`);
  if (i.status!=='submitted') {
    $('#mCopy').onclick = async () => { try { await navigator.clipboard.writeText(inspectLink(i.token)); } catch(e){} closeSheet(); toast('Link copied'); };
    $('#mDone').onclick = async () => { await update('inspections', i.id, { status:'submitted', submitted_at:new Date().toISOString() }); closeSheet(); renderInspection(); toast('Marked submitted'); };
  }
  $('#mDel').onclick = async () => { if (!confirm('Delete this inspection and its photos?')) return; await remove('inspections', i.id); closeSheet(); setTab('inspections'); toast('Deleted'); };
}

function inspectLink(token) { return location.origin + location.pathname.replace(/index\.html$/,'') + 'inspect.html?token=' + token; }

// ════════ ROW + EMPTY HELPERS ════════
function rowHTML({ icon, bg, title, sub, trail, data, tappable }) {
  return `<div class="row ${tappable?'tappable':''}" ${data||''}>
    ${icon!=null?`<div class="row-icon" style="background:${bg||'var(--surface2)'}">${icon}</div>`:''}
    <div class="row-body"><div class="row-title">${esc(title)}</div>${sub?`<div class="row-sub">${esc(sub)}</div>`:''}</div>
    ${trail?`<div class="row-trail">${trail}</div>`:''}</div>`;
}
function emptyHTML(emoji, title, sub) { return `<div class="empty"><span class="emoji">${emoji}</span><div class="title">${esc(title)}</div><div class="sub">${esc(sub)}</div></div>`; }

function wireDelegates(root) {
  $$('[data-property]', root).forEach(e => e.onclick = () => { state.currentProperty = e.dataset.property; renderProperty(); });
  $$('[data-tenant]', root).forEach(e => e.onclick = () => { const t = state.tenants.find(x=>x.id===e.dataset.tenant); if (t) tenantForm(t); });
  $$('[data-inspection]', root).forEach(e => e.onclick = () => { state.currentInspection = e.dataset.inspection; renderInspection(); });
  $$('[data-expense]', root).forEach(e => e.onclick = () => { const x = state.expenses.find(v=>v.id===e.dataset.expense); if (x) expenseForm(x); });
  $$('[data-bill]', root).forEach(e => e.onclick = () => { const x = state.bills.find(v=>v.id===e.dataset.bill); if (x) billForm(x); });
  $$('[data-payment]', root).forEach(e => e.onclick = () => { const x = state.payments.find(v=>v.id===e.dataset.payment); if (x) paymentForm(x); });
  $$('[data-tab]', root).forEach(e => e.onclick = () => setTab(e.dataset.tab));
  $$('[data-add]', root).forEach(e => e.onclick = () => { const pre = e.dataset.prop; const kind = e.dataset.add;
    if (kind==='property') propertyForm();
    else if (kind==='tenant') tenantForm(null, pre);
    else if (kind==='inspection') inspectionForm(pre); });
}

// ════════ SHEET / FORMS ════════
const overlay = $('#sheetOverlay');
overlay.onclick = e => { if (e.target === overlay) closeSheet(); };
function openSheet(html) { $('#sheet').innerHTML = `<div class="sheet-grip"></div>` + html; overlay.classList.add('open'); }
function closeSheet() { overlay.classList.remove('open'); }

function propPickerOptions(selected) { return state.properties.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join(''); }
function tenantPickerOptions(propId, selected) { return '<option value="">— none —</option>' + state.tenants.filter(t=>!propId||t.property_id===propId).map(t=>`<option value="${t.id}" ${t.id===selected?'selected':''}>${esc(t.name)}</option>`).join(''); }

// ── Property form ──
function propertyForm(p) {
  const ed = !!p;
  openSheet(`<div class="sheet-title">${ed?'Edit':'New'} property</div>
    <div class="field"><label>Name *</label><input id="f_name" placeholder="e.g. 14 Oak Street" value="${ed?esc(p.name):''}"></div>
    <div class="field"><label>Address</label><input id="f_addr" placeholder="Full address" value="${ed?esc(p.address||''):''}"></div>
    <div class="field"><label>Notes</label><textarea id="f_notes" placeholder="Access codes, boiler info, anything useful…">${ed?esc(p.notes||''):''}</textarea></div>
    <div class="sheet-actions">
      <button class="btn" id="f_save">${ed?'Save':'Add property'}</button>
      ${ed?'<button class="btn danger" id="f_del">Delete property</button>':''}
    </div>`);
  $('#f_save').onclick = async () => {
    const name = $('#f_name').value.trim(); if (!name) return toast('Name is required');
    const row = { name, address:$('#f_addr').value.trim(), notes:$('#f_notes').value.trim() };
    if (ed) await update('properties', p.id, row); else await insert('properties', row);
    closeSheet(); refreshAfterEdit(); toast('Saved');
  };
  if (ed) $('#f_del').onclick = async () => { if (!confirm('Delete this property and all of its data?')) return; await remove('properties', p.id); closeSheet(); setTab('properties'); toast('Deleted'); };
}

// ── Tenant form ──
function tenantForm(t, preProp) {
  const ed = !!t;
  if (!state.properties.length) return toast('Add a property first');
  openSheet(`<div class="sheet-title">${ed?'Edit':'New'} tenant</div>
    <div class="field"><label>Name *</label><input id="f_name" value="${ed?esc(t.name):''}" placeholder="Tenant name"></div>
    <div class="field"><label>Property *</label><select id="f_prop">${propPickerOptions(ed?t.property_id:preProp)}</select></div>

      <div class="field"><label>Phone</label><input id="f_phone" value="${ed?esc(t.phone||''):''}"></div>

    <div class="field-row">

      <div class="field"><label>Rent due day</label><input id="f_dueday" type="number" min="1" max="31" value="${ed?(t.rent_due_day||1):1}"></div>

    </div>
    <div class="sheet-actions">

// ── Expense form ──
function expenseForm(e) {
  const ed = !!e;
  if (!state.properties.length) return toast('Add a property first');
  const cats = Object.keys(CATEGORY_ICONS);
  openSheet(`<div class="sheet-title">${ed?'Edit':'New'} expense</div>
    <div class="field"><label>Property *</label><select id="f_prop">${propPickerOptions(ed?e.property_id:null)}</select></div>
    <div class="field"><label>Category</label><select id="f_cat">${cats.map(c=>`<option ${ed&&e.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="field"><label>Description</label><input id="f_desc" value="${ed?esc(e.description||''):''}" placeholder="What was it for?"></div>
    <div class="field-row">
      <div class="field"><label>Amount (£) *</label><input id="f_amt" type="number" inputmode="decimal" value="${ed?e.amount:''}"></div>
      <div class="field"><label>Date</label><input id="f_date" type="date" value="${ed?e.spent_on:todayISO()}"></div>
    </div>
    <div class="sheet-actions">
      <button class="btn" id="f_save">${ed?'Save':'Add expense'}</button>
      ${ed?'<button class="btn danger" id="f_del">Delete</button>':''}
    </div>`);
  $('#f_save').onclick = async () => {
    const amount = parseFloat($('#f_amt').value); if (!(amount>0)) return toast('Enter an amount');
    const row = { property_id:$('#f_prop').value, category:$('#f_cat').value, description:$('#f_desc').value.trim(), amount, spent_on:$('#f_date').value||todayISO() };
    if (ed) await update('expenses', e.id, row); else await insert('expenses', row);
    closeSheet(); refreshAfterEdit(); toast('Saved');
  };
  if (ed) $('#f_del').onclick = async () => { await remove('expenses', e.id); closeSheet(); refreshAfterEdit(); toast('Deleted'); };
}

// ── Bill form ──

  const ed = !!b;

  const names = Object.keys(BILL_ICONS);

    <div class="field"><label>Property *</label><select id="f_prop">${propPickerOptions(ed?b.property_id:null)}</select></div>
    <div class="field"><label>Type</label><select id="f_name">${names.map(n=>`<option ${ed&&b.name===n?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class="field"><label>Provider</label><input id="f_prov" value="${ed?esc(b.provider||''):''}" placeholder="e.g. British Gas"></div>
    <div class="field-row">
      <div class="field"><label>Amount (£) *</label><input id="f_amt" type="number" inputmode="decimal" value="${ed?b.amount:''}"></div>
      <div class="field"><label>Due day</label><input id="f_day" type="number" min="1" max="31" value="${ed?(b.due_day||1):1}"></div>
    </div>
    <div class="field"><label>Frequency</label><select id="f_freq">${['monthly','quarterly','annual'].map(f=>`<option ${ed&&b.frequency===f?'selected':''}>${f}</option>`).join('')}</select></div>
    <div class="sheet-actions">
      <button class="btn" id="f_save">${ed?'Save':'Add bill'}</button>
      ${ed?'<button class="btn danger" id="f_del">Delete</button>':''}
    </div>`);
  $('#f_save').onclick = async () => {
    const amount = parseFloat($('#f_amt').value); if (!(amount>0)) return toast('Enter an amount');
    const row = { property_id:$('#f_prop').value, name:$('#f_name').value, provider:$('#f_prov').value.trim(), amount, due_day:parseInt($('#f_day').value)||1, frequency:$('#f_freq').value };
    if (ed) await update('bills', b.id, row); else await insert('bills', row);
    closeSheet(); refreshAfterEdit(); toast('Saved');
  };
  if (ed) $('#f_del').onclick = async () => { await remove('bills', b.id); closeSheet(); refreshAfterEdit(); toast('Deleted'); };
}

// ── Payment form ──
function paymentForm(p) {
  const ed = !!p;
  if (!state.tenants.length) return toast('Add a tenant first');
  const firstTenant = ed ? p.tenant_id : state.tenants[0].id;
  const tOpts = state.tenants.map(t=>`<option value="${t.id}" data-rent="${t.rent_amount||''}" ${t.id===firstTenant?'selected':''}>${esc(t.name)} — ${esc(propName(t.property_id))}</option>`).join('');
  openSheet(`<div class="sheet-title">${ed?'Edit':'Record'} rent</div>
    <div class="field"><label>Tenant *</label><select id="f_tenant">${tOpts}</select></div>
    <div class="field-row">
      <div class="field"><label>Amount (£) *</label><input id="f_amt" type="number" inputmode="decimal" value="${ed?p.amount:(state.tenants.find(t=>t.id===firstTenant)?.rent_amount||'')}"></div>
      <div class="field"><label>Due date</label><input id="f_due" type="date" value="${ed?p.due_date:todayISO()}"></div>
    </div>
    <div class="field"><label>Status</label><select id="f_status"><option value="due" ${ed&&p.status==='due'?'selected':''}>Due</option><option value="paid" ${ed&&p.status==='paid'?'selected':''}>Paid</option></select></div>
    <div class="field" id="paidWrap" style="display:${ed&&p.status==='paid'?'block':'none'}"><label>Paid on</label><input id="f_paid" type="date" value="${ed&&p.paid_on?p.paid_on:todayISO()}"></div>
    <div class="sheet-actions">
      <button class="btn" id="f_save">${ed?'Save':'Add'}</button>
      ${ed&&p.status!=='paid'?'<button class="btn green" id="f_markpaid">Mark as paid</button>':''}
      ${ed?'<button class="btn danger" id="f_del">Delete</button>':''}
    </div>`);
  $('#f_tenant').onchange = e => { const o = e.target.selectedOptions[0]; if (o.dataset.rent) $('#f_amt').value = o.dataset.rent; };
  $('#f_status').onchange = e => { $('#paidWrap').style.display = e.target.value==='paid'?'block':'none'; };
  const save = async (forcePaid) => {
    const tenantId = $('#f_tenant').value; const tenant = state.tenants.find(t=>t.id===tenantId);
    const amount = parseFloat($('#f_amt').value); if (!(amount>0)) return toast('Enter an amount');
    const status = forcePaid ? 'paid' : $('#f_status').value;
    const row = { tenant_id:tenantId, property_id:tenant.property_id, amount, due_date:$('#f_due').value||todayISO(), status, paid_on: status==='paid' ? ($('#f_paid')?.value||todayISO()) : null };
    if (ed) await update('payments', p.id, row); else await insert('payments', row);
    closeSheet(); refreshAfterEdit(); toast('Saved');
  };
  $('#f_save').onclick = () => save(false);
  if (ed && p.status!=='paid') $('#f_markpaid').onclick = () => save(true);
  if (ed) $('#f_del').onclick = async () => { await remove('payments', p.id); closeSheet(); refreshAfterEdit(); toast('Deleted'); };
}

// ── Inspection request form ──
function inspectionForm(preProp) {
  if (!state.properties.length) return toast('Add a property first');
  const due = new Date(); due.setDate(due.getDate()+7);
  const startProp = preProp || state.properties[0].id;
  openSheet(`<div class="sheet-title">Request inspection</div>
    <div class="field"><label>Property *</label><select id="f_prop">${propPickerOptions(startProp)}</select></div>
    <div class="field"><label>Tenant</label><select id="f_tenant">${tenantPickerOptions(startProp)}</select></div>
    <div class="field"><label>Submit by</label><input id="f_due" type="date" value="${due.toISOString().slice(0,10)}"></div>
    <div class="field"><label>Note to tenant</label><textarea id="f_note">Please take photos of each room, the kitchen, bathroom, boiler and smoke alarms.</textarea></div>
    <div class="sheet-actions"><button class="btn" id="f_save">Create link</button></div>`);
  $('#f_prop').onchange = () => { $('#f_tenant').innerHTML = tenantPickerOptions($('#f_prop').value); };
  $('#f_save').onclick = async () => {
    const row = { property_id:$('#f_prop').value, tenant_id:$('#f_tenant').value||null, token:uid(), status:'pending', requested_at:new Date().toISOString(), due_date:$('#f_due').value||null, notes:$('#f_note').value.trim() };
    const created = await insert('inspections', row);
    closeSheet();
    state.currentInspection = created.id; setTab('inspections'); renderInspection();
    toast('Inspection created');
  };
}

function refreshAfterEdit() {
  if ($('#screen-property').classList.contains('active')) renderProperty();
  else if ($('#screen-inspection').classList.contains('active')) renderInspection();
  else renderCurrent();
}

// Wire add buttons present in the static markup
wireDelegates(document);
</script>
</body>
