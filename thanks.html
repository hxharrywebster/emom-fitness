<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0e0c">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Thanks — Buscho's Football Clinic</title>
<style>
  :root{
    --bg:#0a0e0c; --surface:#161d18; --border:#2a382e;
    --green:#25e36a; --green-bright:#4dff8c; --green-ink:#06210f;
    --text:#f4f8f5; --text2:#b9c6bd;
    --font:-apple-system,'SF Pro Display',BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--font); background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; line-height:1.5;
  }
  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:24px; padding:48px 36px; max-width:520px; width:100%;
    text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.45);
  }
  .badge{
    width:84px;height:84px;border-radius:50%;
    background:linear-gradient(135deg,var(--green),#0c8f43);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 24px; font-size:42px;
  }
  h1{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:900;letter-spacing:-.02em;margin-bottom:14px}
  p{color:var(--text2);font-size:1.0625rem;margin-bottom:10px}
  .home{
    display:inline-flex;align-items:center;gap:8px;margin-top:24px;
    padding:14px 26px;border-radius:var(--radius);
    background:var(--green);color:var(--green-ink);
    font-weight:800;text-decoration:none;font-size:1.05rem;
    transition:transform .12s,background .2s;
  }
  .home:hover{background:var(--green-bright)}
  .home:active{transform:scale(.97)}
  @media(prefers-reduced-motion:reduce){.home{transition:none}}
</style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">⚽</div>
    <h1>You're in! Thanks for reaching out.</h1>
    <p>We've received your enquiry. Coach Buscho will be in touch within 1&ndash;2 days to lock in your free trial session.</p>
    <p>Keen sooner? Give us a call or DM us on Instagram &mdash; details are on the home page.</p>
    <a class="home" href="/">&larr; Back to home</a>
  </main>
</body>
</html>
